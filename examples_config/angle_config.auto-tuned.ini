[ANGLE]

; Backend selection (don't change! if you use vulkan and change to dx11 or dx11 to vulkan it may break)
backend=d3d11

; Enable debug log file (angle_log.txt)
debug=false

; Log file output path relative to GD directory
log_file=angle_log.txt

unlock_fps_cap=false

frame_pacing=false

frame_pacing_target=180

force_no_vsync=true

enabled=true

language=en

[Boost]

; Force discrete GPU on dual-GPU laptops (Nvidia Optimus / AMD Enduro)
gpu_forcer=true

; High-performance lock-free heap memory allocator
fast_allocator=true

; Set Windows timer resolution to 1ms for accurate frame pacing and Sleep
timer_fix=true

; Increase process and main thread CPU execution priority
thread_boost=true

; CPU core affinity bitmask (0 = automatic OS scheduling)
cpu_affinity=0

; Enable SSE2 fast math optimizations
sse_math=true

; Disable Windows 10/11 EcoQoS CPU power throttling
power_boost=true

unlock_fps_cap=true

frame_pacing=false

frame_pacing_target=0

force_no_vsync=true

enabled=true

[BoostAdvanced]

; Real-time RGBA8 to DXT1 texture compression (keep false to avoid font/UI artifacts)
tex_compress=false

; Initialize Nvidia NVAPI performance profile
nvapi_profile=true

; Cache compiled shaders to disk to prevent stuttering on future launches
shader_cache=true

; Folder path for stored shader cache
shader_cache_dir=shader_cache

; Patch PE header for Large Address Aware (enables 4GB RAM usage on 32-bit GD)
large_address_aware=true

; Skip redundant OpenGL state changes (glBindTexture, glUseProgram, etc.)
gl_state_dedup=true

; Pre-load process memory working set pages into RAM at launch
working_set_prefetch=false

; FMOD audio engine sample rate and buffer tuning
fmod_tuning=false

; FMOD target sample rate in Hz
fmod_sample_rate=44100

; Multi-threaded background asset loader for PNG and PLIST files
async_asset_loader=false

; Number of worker threads for background asset loading
async_loader_threads=2

; High-resolution spin-wait replacement for Sleep() calls
precise_sleep=false

; Automatic Win32 heap compaction interval in seconds (0 = disabled)
heap_compact_interval=0

; Enable Direct3D11 multithreaded device protection
d3d11_multithread=false

[BoostRender]

; Disable OpenGL depth testing and buffer clearing
depth_off=false

; Skip mipmap generation for 2D textures to save VRAM and GPU bandwidth
mipmap_off=false

; Turn glFinish() calls into no-op to eliminate CPU-GPU pipeline stalls
noop_finish=true

; Return GL_NO_ERROR for glGetError() calls to reduce driver overhead
noop_geterror=true

; Pre-allocated persistent Vertex Buffer Object (VBO) pool
vbo_pool=false

; VBO pool size limit in megabytes
vbo_pool_size_mb=16

; Compress FP32 vertex attributes to FP16 half-floats
vertex_compress=false

; Enable instanced drawing via glDrawElementsInstanced
instancing=false

; Dynamic resolution scaling during heavy scene rendering
dyn_resolution=false

; Target FPS threshold for dynamic resolution scaling
dyn_res_target_fps=60

[BoostIO]

; Optimize Windows file read requests with sequential scan hints
fast_io=true

; Load game Resources folder into a RAM-disk virtual drive
ramdisk_cache=false

; Path to RAM-disk directory
ramdisk_path=

; Cache GetProcAddress and wglGetProcAddress function lookups
loader_cache=true

iocp_loader=false

iocp_loader_concurrency=0

[BoostCPU]

; SSE2-accelerated memory copying routine
sse_memcpy=false

; Bounding Volume Hierarchy scene graph culling
scene_bvh=false

; De-duplicate std::string allocations in memory
string_intern=false

; Replace system allocator with mimalloc memory manager
mimalloc_full=false

; Suppress background debug log streams (printf, OutputDebugString)
silent_debug=true

[BoostSystem]

; Set WDDM GPU scheduling priority to HIGH
wddm_priority=true

; Register process with Windows Game Mode scheduling APIs
game_mode=true

; Pin main rendering thread to performance cores on hybrid CPUs
smart_cpu_pin=false

; Disable Windows security mitigations (CFG, ASLR) for higher performance
mitigation_off=false

[BoostLatency]

; Allow screen tearing for lowest possible input latency (D3D11 Flip model)
allow_tearing=true

; Enable DXGI Waitable Swap Chain for reduced frame queue latency
waitable_swap=true

; Register process thread with Multimedia Class Scheduler (MMCSS)
mmcss_pro_audio=true

; Pre-warm and compile shaders during initial application load
shader_warmup=true

; Set DXGI maximum frame latency limit to 1 frame
low_latency=false

; Enable OpenGL no-error context (EGL_CONTEXT_OPENGL_NO_ERROR_KHR)
gl_no_error=false

; Disable CPU thread core migration stutters
anti_stutter=true

; Target frame rate for high-precision frame pacer (0 = uncapped)
frame_pacing_target=0

; High-precision QPC frame pacing loop
frame_pacing=false

; Remove built-in 60 FPS frame rate limit
unlock_fps_cap=false

present_hints=true

[BoostGD]

; Skip initial game intro splash screen
skip_intro=true

; Object memory pool for cocos2d scene graph nodes
object_pool=true

; Maximum node object count in memory pool
object_pool_size=4096

; Cache level trigger condition evaluation results
trigger_cache=true

; Use binary format for saved level property lists (.plist)
plist_binary=true

; Folder path for cached plist files
plist_cache_dir=plist_cache

; Disable camera shake and screen flash visual effects
skip_shake_flash=false

; Asynchronously decode level data on background worker threads
level_predecode=false

; Worker thread count for level pre-decoding
predecode_threads=2

[BoostRenderAdv]

; Automatically merge separate texture files into a single texture atlas
atlas_merge=false

; Maximum texture atlas dimension in pixels
atlas_size=2048

; Camera frustum culling for off-screen cocos2d nodes
frustum_cull=true

; Framebuffer Object (FBO) allocation reuse pool
fbo_cache=false

; FBO cache pool capacity limit
fbo_pool_size=8

; Enable triple buffering in swap chain
triple_buffer=false

; Disable Multi-Sample Anti-Aliasing (MSAA)
disable_aa=false

; Optimize OpenGL blend modes for opaque geometry
blend_optimize=true

[BoostCocos]

; Limit maximum simultaneous active particle effects
particle_throttle=true

; Maximum particle count ceiling
particle_max=300

; Pre-load texture atlas cache during game startup
texcache_preload=false

; Force automatic batching for non-batched sprite draw calls
batch_force=false

; Cache rendered text glyph label textures
label_cache=true

; Skip evaluation of inactive timers in cocos2d scheduler tick
scheduler_skip=true

; Sort draw calls by texture binding to reduce state changes
drawcall_sort=false

; Automatically generate index buffers for quad sprite batches
index_buffer_gen=true

[BoostSysAdv]

; Enable Flush-To-Zero (FTZ) and Denormals-Are-Zero (DAZ) FPU flags
ftz_daz=true

; Disable Spectre and Meltdown CPU speculative execution mitigations
spectre_off=false

; Set process disk I/O scheduling priority to High
io_priority=true

; Set process memory working set priority to High
mem_priority=true

; Reduce default stack memory allocation size for main thread
stack_trim=true

[BoostPipeline]

; Enable pipeline draw call sorting
pipe_drawsort=false

; Optimize scissor rectangle calculations
scissor_tight=false

; De-duplicate vertex buffer attributes
vertex_dedup=true

; Render particle/shader effects at half resolution
halfres_effects=false

; Simplify fragment shader computations
shader_simplify=false

; Coalesce adjacent small batch draw commands
batch_coalesce=false

effect_lod=false

effect_lod_min_fps=0

static_batch=false

drawcall_budget=false

drawcall_budget_min_fps=30

[BoostNetwork]

; Asynchronously pre-resolve DNS hostnames for Geometry Dash servers
dns_prefetch=true

; Re-use persistent HTTP connections (Keep-Alive connection pool)
http_pool=true

; Block outbound network traffic during level gameplay
online_block_gameplay=true

; Cache server response data (level lists, comments) in memory
server_cache=true

; Apply TCP_NODELAY and socket buffer tuning
winsock_opt=true

[BoostAudio]

; Limit maximum active FMOD audio channels
fmod_channel_limit=true

; Maximum concurrent active FMOD audio channels
fmod_max_channels=16

; Force FMOD audio mixing to run on CPU
fmod_software_mix=true

; Pin FMOD audio processing thread to dedicated CPU core
audio_thread_pin=true

; Pre-load all sound effect files into memory at startup
sound_preload=true

; Compress stored audio buffers in memory
audio_ram_compress=false

[BoostExtreme]

; Disable Event Tracing for Windows (ETW) profiling overhead
etw_disable=true

; Disable Windows Error Reporting (WER) crash dialogs
wer_disable=true

; Remove Zone.Identifier file stream from loaded DLLs
smartscreen_off=true

; NUMA-aware memory allocation strategy
numa_aware=true

; Use 2MB Large Memory Pages for process allocations
huge_pages=false

; Disable Windows SuperFetch / Prefetcher tracking for GD
prefetcher_off=false

; Lock process working set memory pages into physical RAM
workingset_lock=true

; Increase GPU driver command submission thread priority
gpu_thread_prio=true

; Skip eglSwapBuffers when frame content is unchanged
present_skip_idle=false

; Render scene at half resolution and upscale to backbuffer
halfres_render=false

halfres_filter=nearest

halfres_scale=50

halfres_sharpen=0.6

thread_qos=true

[HUD]

enabled=true

show_fps=true

show_drawcalls=true

show_frame_time=true

position=0

toggle_vk=165

toggle_ctrl=0

toggle_shift=0

toggle_alt=1

reload_vk=116

