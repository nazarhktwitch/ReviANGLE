; ║                                                                          ║
; ║   ReviANGLE v1.0.0 ▸ Performance Suite for Geometry Dash                 ║
; ║                                                                          ║
; ║   Пресет: PERFORMANCE (НОВЫЙ ПК / LOW LATENCY)                           ║
; ║     Максимальный FPS + минимальный input lag.                            ║
; ║                                                                          ║
; ║   Legend / Легенда:                                                      ║
; ║     🟢  = безопасно ВЕЗДЕ (любое железо)                                ║
; ║     ⚠️  = рискованно - тестируй перед использованием                    ║
; ║                                                                          ║
; ╚══════════════════════════════════════════════════════════════════════════╝


; ┌──────────────────────────────────────────────────────────────────────────┐
; │  ИСТОРИЯ ВЕРСИЙ:                                                         │
; │  v1.0.6: STABILITY preset - force_no_vsync OFF, frame_pacing_target=60  │
; │          unlock_fps_cap отключён, jitter margin 0.1ms для smoothness    │
; └──────────────────────────────────────────────────────────────────────────┘

[ANGLE]

; 🟢 D3D11 backend - проверен на слабых GPU и интегрированных картах
backend=d3d11

; 🟢 VSync ОСТАЁТСЯ ВКЛЮЧЁН - стабильность важнее input lag на слабом ПК
force_no_vsync=false

; 🟢 frame_pacing с jitter margin 0.1ms - плавный FPS без микрофризов
frame_pacing=true
frame_pacing_target=60

debug=false
log_file=angle_log.txt
enabled=true


[Boost]

; 🔴 [v1.0.6] unlock_fps_cap ПОЛНОСТЬЮ ОТКЛЮЧЁН - модуль удалён из кода
unlock_fps_cap=false


; ┌──────────────────────────────────────────────────────────────────────────┐
; │  🟢 БАЗОВЫЕ УСКОРЕНИЯ - работают на любом железе                        │
; └──────────────────────────────────────────────────────────────────────────┘
; 🟢  gpu_forcer     - заставляет ноутбуки использовать дискретную GPU
; 🟢  fast_allocator - быстрый аллокатор памяти (lock-free пул)
; 🟢  timer_fix      - 1ms точность таймера Windows для стабильного FPS
; 🟢  thread_boost   - ABOVE_NORMAL приоритет процесса + HIGHEST для потока
; 🟢  sse_math        - SSE2 инструкции процессора (безопасно везде)
; 🟢  power_boost     - отключает даунклок CPU когда Windows думает что игра
;                        в "простое"

; 🟢  cpu_affinity   - 0 = автоматический выбор ядер (не трогай на старых CPU)

gpu_forcer=true
fast_allocator=true
timer_fix=true
thread_boost=true
cpu_affinity=0
sse_math=true
power_boost=true


; ┌──────────────────────────────────────────────────────────────────────────┐
; │  � Безопасные настройки - работают на любом железе                        │
; └──────────────────────────────────────────────────────────────────────────┘

; �  mipmap_off      - ВЫКЛЮЧЕНО: качество текстур остается оригинальным
; �  disable_aa      - ВЫКЛЮЧЕНО: качество сглаживания остается оригинальным
; �  scheduler_skip  - пропускает неактивные таймеры cocos2d (бесплатный буст)

[BoostAdvanced]

; ⚠️  tex_compress    - ВЫКЛЮЧЕНО: BC7 пережатие нестабильно на ряде GPU
tex_compress=false

nvapi_profile=true
shader_cache=true
shader_cache_dir=shader_cache
large_address_aware=true
gl_state_dedup=true

; ⚠️  working_set_prefetch - ВЫКЛЮЧЕНО: может вызывать задержки
working_set_prefetch=false

; ⚠️  fmod_tuning    - ВЫКЛЮЧЕНО: IAT hook нестабилен на ряде версий Windows
fmod_tuning=false

; ⚠️  async_asset_loader - ВЫКЛЮЧЕНО: нестабильно в некоторых конфигурациях
async_asset_loader=false
async_loader_threads=2

precise_sleep=true
heap_compact_interval=0

; ⚠️  d3d11_multithread - ВЫКЛЮЧЕНО: конфликтует с threading-ом ANGLE
d3d11_multithread=false


[BoostRender]

; �  depth_off=false - НЕ ОТКЛЮЧАТЬ! Критично для порядка триггеров GD
depth_off=false

; �  mipmap_off - ВЫКЛЮЧЕНО: качество текстур остается оригинальным
mipmap_off=false

; �  noop_finish    - пропуск glFinish убирает блокировку пайплайна
noop_finish=true

; �  noop_geterror  - пропуск glGetError экономит обращение к драйверу
noop_geterror=true

; ⚠️  vbo_pool       - ВЫКЛЮЧЕНО: конфликтует с батчером cocos2d
vbo_pool=false
vbo_pool_size_mb=16

; ⚠️  vertex_compress - рискованно, ломает UV на тексте/UI
vertex_compress=false

; ⚠️  instancing     - требует переписывания draw-вызовов cocos2d
instancing=false

; ⚠️  dyn_resolution - ВЫКЛЮЧЕНО: создаёт видимый jitter
dyn_resolution=false
dyn_res_target_fps=60


[BoostIO]

; �  fast_io       - быстрое последовательное чтение с диска
fast_io=true

; ⚠️  ramdisk_cache - опционально при 8+ GB RAM
ramdisk_cache=false
ramdisk_path=

; 🟢  loader_cache  - кеширует GetProcAddress, экономит время при старте
loader_cache=true

; ⚠️  iocp_loader - ВЫКЛЮЧЕНО по умолчанию (opt-in)
iocp_loader=false
iocp_loader_concurrency=0


[BoostCPU]

; ⚠️  sse_memcpy    - ВЫКЛЮЧЕНО: hook может крашить на некоторых системах
sse_memcpy=false

; ⚠️  scene_bvh     - экспериментально, нестабильно
scene_bvh=false

; ⚠️  string_intern - ВЫКЛЮЧЕНО: hook нестабилен
string_intern=false

; ⚠️  mimalloc_full - ВЫКЛЮЧЕНО: DLL не идёт в комплекте
mimalloc_full=false

; 🟢  silent_debug  - убирает printf/OutputDebugString
silent_debug=true


[BoostSystem]

; 🟢  wddm_priority - приоритет планировщика WDDM
wddm_priority=true

; 🟢  game_mode - регистрация в Windows Game Mode
game_mode=true

; ⚠️  smart_cpu_pin - ВЫКЛЮЧЕНО: no-op на старых, риск на гибридных CPU
smart_cpu_pin=false

; ⚠️  mitigation_off - ВЫКЛЮЧЕНО: не стоит 1-2% потери безопасности
mitigation_off=false


[BoostLatency]

; ⚠️ allow_tearing - ВЫКЛЮЧЕНО (STABILITY preset). На старом железе tearing заметен.
;     [v1.0.6 FIX] Теперь с vtable validation - безопаснее, но оставляем OFF.
allow_tearing=false
waitable_swap=true

; 🟢  frame_pacing - САМОЕ ВАЖНОЕ. [v1.0.6 FIX] jitter margin 0.1ms - плавно без фризов.
;     target=60 - явный лимит для стабильности на слабом ПК.
frame_pacing=true
frame_pacing_target=60

; 🟢  mmcss_pro_audio - 1ms гранулярность планирования
mmcss_pro_audio=true

; 🟢  shader_warmup - прогрев шейдеров для устранения compile-фризов
shader_warmup=true

; 🟢  [v1.0.6 FIX] low_latency - vtable validation + correct slot 12
low_latency=true

; � [v1.0.6] unlock_fps_cap ПОЛНОСТЬЮ ОТКЛЮЧЁН - модуль удалён из кода.
unlock_fps_cap=false

; 🟢  [v1.0.6 FIX] anti_stutter - теперь HIGH_PRIORITY + TIME_CRITICAL thread
anti_stutter=true

; 🟢  [v1.0.6 FIX] present_hints - re-enabled с vtable validation
present_hints=true


[BoostGD]

; ⚠️  level_predecode - ВЫКЛЮЧЕНО: конкурирует за CPU с главным потоком
level_predecode=false
predecode_threads=2

skip_intro=true
object_pool=true
object_pool_size=4096
trigger_cache=true
plist_binary=true
plist_cache_dir=plist_cache
skip_shake_flash=false


[BoostRenderAdv]

; ⚠️  atlas_merge      - ВЫКЛЮЧИТЬ! UV remapping ломает кастомные уровни
atlas_merge=false
atlas_size=2048

; 🟢  frustum_cull    - отсекает невидимые объекты
frustum_cull=true

; ⚠️  fbo_cache        - ВЫКЛЮЧЕНО: источник jitter
fbo_cache=false
fbo_pool_size=8

; ⚠️  triple_buffer   - ВЫКЛЮЧЕНО: добавляет input lag
triple_buffer=false

; �  disable_aa      - ВЫКЛЮЧЕНО: качество остается оригинальным
disable_aa=false

; 🟢  blend_optimize  - ускоряет смешение без потери качества
blend_optimize=true


[BoostCocos]

; �  particle_throttle - ограничивает частицы для стабильного FPS
particle_throttle=true
particle_max=300

; ⚠️  texcache_preload - замедляет запуск на 2-3 сек
texcache_preload=false

; ⚠️  batch_force      - дает глитчи на спрайтах
batch_force=false

; 🟢  label_cache      - кэш текстовых меток
label_cache=true

; 🟢  scheduler_skip    - пропуск неактивных таймеров (бесплатно)
scheduler_skip=true

; ⚠️  drawcall_sort    - ломает z-порядок в редакторе
drawcall_sort=false

; 🟢  index_buffer_gen  - генерация индексного буфера
index_buffer_gen=true


[BoostSysAdv]

; 🟢  ftz_daz          - режим flush-to-zero для FP, безопасен
ftz_daz=true

; ⚠️  spectre_off      - не стоит 1-2% потери безопасности
spectre_off=false

io_priority=true
mem_priority=true

; 🟢  stack_trim       - освобождает неиспользуемые страницы стека
stack_trim=true


[BoostPipeline]

; ⚠️  pipe_drawsort  - ВЫКЛЮЧЕНО: нестабильно на ряде уровней
pipe_drawsort=false

; ⚠️  scissor_tight  - ВЫКЛЮЧЕНО: может обрезать спрайты
scissor_tight=false

; 🟢  vertex_dedup   - убирает дублирующие вершины
vertex_dedup=true

; ⚠️  halfres_effects - ВЫКЛЮЧЕНО: заметно на некоторых эффектах
halfres_effects=false

shader_simplify=false
batch_coalesce=false

; ⚠️  effect_lod     - ВЫКЛЮЧЕНО по умолчанию (opt-in)
effect_lod=false
effect_lod_min_fps=0

; ⚠️  static_batch   - ВЫКЛЮЧЕНО по умолчанию (opt-in)
static_batch=false

drawcall_budget=false


[BoostNetwork]

; 🟢  Все сетевые оптимизации безопасны
dns_prefetch=true
http_pool=true
online_block_gameplay=true
server_cache=true
winsock_opt=true


[BoostAudio]

; �  fmod_channel_limit - ограничение каналов для экономии CPU
fmod_channel_limit=true
fmod_max_channels=16

; �  fmod_software_mix - смешение звука на CPU
fmod_software_mix=true

; �  audio_thread_pin - привязка FMOD к ядру
audio_thread_pin=true

; 🟢  sound_preload   - предзагрузка звуков
sound_preload=true

audio_ram_compress=false


[BoostExtreme]

; 🟢  Все системные оптимизации безопасны
etw_disable=true
wer_disable=true
smartscreen_off=true
numa_aware=true

huge_pages=false
prefetcher_off=false

workingset_lock=true
gpu_thread_prio=true
thread_qos=true

present_skip_idle=false

halfres_render=false
halfres_filter=nearest
halfres_scale=50
halfres_sharpen=0.6
