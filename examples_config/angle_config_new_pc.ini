; ╔══════════════════════════════════════════════════════════════════════════╗
; ║                                                                          ║
; ║   ReviANGLE v1.0.0 ▸ Performance Suite for Geometry Dash                 ║
; ║                                                                          ║
; ║   Пресет: PERFORMANCE (НОВЫЙ ПК / LOW LATENCY)                           ║
; ║     Максимальный FPS + минимальный input lag.                            ║
; ║                                                                          ║
; ║   Legend / Легенда:                                                      ║
; ║     🟢  = безопасно ВЕЗДЕ (любое железо)                                ║
; ║     ⚠️  = рискованно - тестируй перед использованием                    ║
; ║                                                                          ║
; ╚══════════════════════════════════════════════════════════════════════════╝


; ┌──────────────────────────────────────────────────────────────────────────┐
; │  ИСТОРИЯ ВЕРСИЙ:                                                         │
; │  v1.0.6: LOW LATENCY overhaul - отключен unlock_fps (баг), включены     │
; │          waitable_swap + present_hints с vtable validation,              │
; │          frame_pacing jitter margin уменьшен (0.1ms),                   │
; │          anti_stutter теперь HIGH_PRIORITY + TIME_CRITICAL               │
; └──────────────────────────────────────────────────────────────────────────┘

[ANGLE]

; 🟢 D3D11 backend - работает везде. d3d11n для DX12 feature level.
backend=d3d11

; 🟢 [v1.0.6] force_no_vsync - отключает VSync + FSO Windows для минимального input lag
; ВКЛЮЧАЙ только если не боишься tearing (или есть G-Sync/FreeSync)
force_no_vsync=true

; 🟢 [v1.0.6 FIX] frame_pacing jitter margin уменьшен с 1.5ms до 0.1ms - убирает микрофризы
frame_pacing=true
frame_pacing_target=0

debug=false
log_file=angle_log.txt
enabled=true


[Boost]

; 🔴 [v1.0.6] unlock_fps_cap ПОЛНОСТЬЮ ОТКЛЮЧЕН - вызывал input lag и timing issues
unlock_fps_cap=false


; ┌──────────────────────────────────────────────────────────────────────────┐
; │  🟢 БАЗОВЫЕ УСКОРЕНИЯ - работают на любом железе                        │
; └──────────────────────────────────────────────────────────────────────────┘
; 🟢  gpu_forcer     - заставляет ноутбуки использовать дискретную GPU
; 🟢  fast_allocator - быстрый аллокатор памяти (lock-free пул)
; 🟢  timer_fix      - 1ms точность таймера Windows для стабильного FPS
; 🟢  thread_boost   - ABOVE_NORMAL приоритет процесса + HIGHEST для потока
; 🟢  sse_math        - SSE2 инструкции процессора (безопасно везде)
; 🟢  power_boost     - отключает даунклок CPU когда Windows думает что игра
;                        в "простое"

; � cpu_affinity=0 - не трогать, автоматический выбор ядер
cpu_affinity=0
gpu_forcer=true
fast_allocator=true
timer_fix=true
thread_boost=true
sse_math=true
power_boost=true


; ┌──────────────────────────────────────────────────────────────────────────┐
; │  🟢 БАЗОВЫЕ ОТКЛЮЧЕНИЯ - отключение ненужного для нового железа        │
; └──────────────────────────────────────────────────────────────────────────┘

; 🟢  mipmap_off       - на новом железе можно включить (больше VRAM)
;     🟡 Но выключение = быстрее загрузка уровней
mipmap_off=false

; 🟢  disable_aa      - на новом GPU MSAA 2x-4x не проблема
disable_aa=false

; 🟢  scheduler_skip  - пропускает неактивные таймеры cocos2d (бесплатный буст)
scheduler_skip=true

[BoostAdvanced]

; ⚠️  tex_compress    - ВЫКЛЮЧЕНО: BC7 пережатие нестабильно на ряде GPU
tex_compress=false

; �  nvapi_profile   - NVIDIA профиль производительности
nvapi_profile=true

; 🟢  shader_cache    - ускоряет повторный запуск уровней
shader_cache=true
shader_cache_dir=shader_cache
large_address_aware=true
gl_state_dedup=true

; ⚠️  working_set_prefetch - ВЫКЛЮЧЕНО: может вызывать задержки
working_set_prefetch=false

; ⚠️  fmod_tuning     - тестируй на своей версии игры
fmod_tuning=false

; ⚠️  async_asset_loader - ВЫКЛЮЧЕНО: нестабильно в некоторых конфигурациях
async_asset_loader=false
async_loader_threads=2


precise_sleep=true
heap_compact_interval=0

; ⚠️  d3d11_multithread - ВЫКЛЮЧЕНО: конфликтует с threading-ом ANGLE
d3d11_multithread=false


[BoostRender]

; 🔴 ВЫКЛЮЧИТЬ на новом железе! Эти функции критичны для порядка триггеров в GD
depth_off=false

; 🟡 mipmap_off       - можно выключить (улучшает качество текстур)
mipmap_off=false

; 🟢  noop_finish     - пропуск glFinish убирает блокировку пайплайна
noop_finish=true

; 🟢  noop_geterror   - пропуск glGetError экономит обращение к драйверу
noop_geterror=true

; ⚠️  vbo_pool        - ВЫКЛЮЧЕНО: конфликтует с батчером cocos2d
vbo_pool=false
vbo_pool_size_mb=16

; ⚠️  vertex_compress - рискованно, ломает UV на тексте/UI
vertex_compress=false

; ⚠️  instancing      - требует переписывания draw-вызовов cocos2d
instancing=false

; 🔴 dyn_resolution   - ВЫКЛЮЧИТЬ! Создаёт видимый jitter
dyn_resolution=false
dyn_res_target_fps=60


[BoostIO]

; 🟢  fast_io         - быстрое последовательное чтение с диска
fast_io=true

; 🟡 ramdisk_cache   - если у тебя 16+ GB RAM, можно включить
;     Для уровней с большим количеством объектов
ramdisk_cache=false
ramdisk_path=

; 🟢  loader_cache    - кеширует GetProcAddress - экономит время при старте
loader_cache=true

; ⚠️  iocp_loader     - ВЫКЛЮЧЕНО по умолчанию (opt-in)
iocp_loader=false
iocp_loader_concurrency=0


[BoostCPU]

; ⚠️  sse_memcpy     - ВЫКЛЮЧЕНО: hook может крашить на некоторых системах
sse_memcpy=false

; ⚠️  scene_bvh       - экспериментально, нестабильно
scene_bvh=false

; ⚠️  string_intern   - тестируй, может крашить
string_intern=false

; ⚠️  mimalloc_full   - не идёт в комплекте, нестабильно
mimalloc_full=false

; 🟢  silent_debug    - убирает printf/OutputDebugString
silent_debug=true


[BoostSystem]

; 🟢  wddm_priority   - приоритет планировщика WDDM
wddm_priority=true

; 🟢  game_mode       - регистрация в Windows Game Mode
game_mode=true

; ⚠️  smart_cpu_pin  - ВЫКЛЮЧЕНО: no-op на старых CPU, риск на гибридных
smart_cpu_pin=false

; ⚠️  mitigation_off  - не стоит 1-2% потери безопасности
mitigation_off=false


[BoostLatency]

; 🟢 [v1.0.6 FIX] allow_tearing - теперь с vtable validation (проверка перед вызовами).
; ВКЛЮЧЕНО для max FPS. Безопасно: no-op если ANGLE выбирает BLIT swap chain.
allow_tearing=true
waitable_swap=true

; 🟢  frame_pacing - САМОЕ ВАЖНОЕ. Jitter margin уменьшен до 0.1ms (было 1.5ms).
;     Убирает микрофризы от loose pacing.
frame_pacing=true
frame_pacing_target=0

; 🟢  mmcss_pro_audio - 1ms гранулярность планирования
mmcss_pro_audio=true

; 🟡 shader_warmup - прогрев шейдеров при старте (убирает compile-stutter)
shader_warmup=true

; 🟢  low_latency - IDXGIDevice1::SetMaximumFrameLatency(1) + vtable validation
low_latency=true

; � [v1.0.6] unlock_fps_cap ПОЛНОСТЬЮ ОТКЛЮЧЁН - модуль удалён из кода.
; Используй frame_pacing + force_no_vsync для разблокировки FPS.
unlock_fps_cap=false

; 🟢  [v1.0.6 FIX] anti_stutter - теперь HIGH_PRIORITY_CLASS + TIME_CRITICAL
anti_stutter=true

; 🟢  [v1.0.6 FIX] present_hints - re-enabled с vtable validation
present_hints=true


[BoostGD]

; ⚠️  level_predecode - ВЫКЛЮЧЕНО: конкурирует за CPU с главным потоком
level_predecode=false
predecode_threads=2

skip_intro=true
object_pool=true
object_pool_size=4096
trigger_cache=true
plist_binary=true
plist_cache_dir=plist_cache
skip_shake_flash=false


[BoostRenderAdv]

; ⚠️  atlas_merge     - ВЫКЛЮЧИТЬ! UV remapping ломает кастомные уровни
atlas_merge=false
atlas_size=2048

; 🟡 frustum_cull    - ВКЛЮЧИТЬ! Отсекает невидимые объекты
frustum_cull=true

; ⚠️  fbo_cache       - ВЫКЛЮЧЕНО: источник jitter
fbo_cache=false
fbo_pool_size=8

; 🔴 triple_buffer   - ВЫКЛЮЧИТЬ! Добавляет input lag
triple_buffer=false

; 🟡 disable_aa      - на новом GPU можно оставить включённым
disable_aa=false

; 🟢  blend_optimize  - ускоряет смешение без потери качества
blend_optimize=true


[BoostCocos]

; �  particle_throttle - ограничивает частицы для стабильного FPS
particle_throttle=true
particle_max=300

; ⚠️  texcache_preload - замедляет запуск на 2-3 сек
texcache_preload=false

; ⚠️  batch_force    - тестируй, может давать глитчи
batch_force=false

; 🟢  label_cache    - кэш текстовых меток
label_cache=true

; 🟢  scheduler_skip - пропуск неактивных таймеров
scheduler_skip=true

; ⚠️  drawcall_sort  - ломает z-порядок в редакторе
drawcall_sort=false

; 🟢  index_buffer_gen - генерация индексного буфера
index_buffer_gen=true


[BoostSysAdv]

; 🟢  ftz_daz        - режим flush-to-zero для FP, безопасен
ftz_daz=true

; ⚠️  spectre_off    - не стоит 1-2% потери безопасности
spectre_off=false

io_priority=true
mem_priority=true

; 🟢  stack_trim     - освобождает неиспользуемые страницы стека
stack_trim=true


[BoostPipeline]

; ⚠️  pipe_drawsort  - ВЫКЛЮЧЕНО: нестабильно на ряде уровней
pipe_drawsort=false

; ⚠️  scissor_tight  - ВЫКЛЮЧЕНО: может обрезать спрайты
scissor_tight=false

; �  vertex_dedup   - убирает дублирующие вершины
vertex_dedup=true

; ⚠️  halfres_effects - ВЫКЛЮЧЕНО: заметно на некоторых эффектах
halfres_effects=false

; ⚠️  shader_simplify - тестируй, может ухудшать качество
shader_simplify=false

; ⚠️  batch_coalesce  - ВЫКЛЮЧЕНО: может ломать порядок draw calls
batch_coalesce=false

; ⚠️  effect_lod     - ВЫКЛЮЧЕНО по умолчанию (opt-in)
effect_lod=false
effect_lod_min_fps=0

; ⚠️  static_batch   - ВЫКЛЮЧЕНО по умолчанию (opt-in)
static_batch=false

; ⚠️  drawcall_budget - ВЫКЛЮЧЕНО: может срезать детали
drawcall_budget=false
drawcall_budget_min_fps=28


[BoostNetwork]

; 🟢  Все сетевые оптимизации безопасны
dns_prefetch=true
http_pool=true
online_block_gameplay=true
server_cache=true
winsock_opt=true


[BoostAudio]

; �  fmod_channel_limit - ограничение каналов для экономии CPU
fmod_channel_limit=true
fmod_max_channels=16

; �  fmod_software_mix - смешение звука на CPU
fmod_software_mix=true

; �  audio_thread_pin - привязка FMOD к ядру
audio_thread_pin=true

; �  sound_preload   - предзагрузка звуков
sound_preload=true

audio_ram_compress=false


[BoostExtreme]

; 🟢  Все системные оптимизации безопасны
etw_disable=true
wer_disable=true
smartscreen_off=true
numa_aware=true

; ⚠️  huge_pages     - ВЫКЛЮЧЕНО: требует SeLockMemoryPrivilege
huge_pages=false

; ⚠️  prefetcher_off - ВЫКЛЮЧЕНО: требует admin
prefetcher_off=false

workingset_lock=true
gpu_thread_prio=true
thread_qos=true

present_skip_idle=false

halfres_render=false
halfres_filter=nearest
halfres_scale=50
halfres_sharpen=0.6
